name: "${COMPOSE_PROJECT_NAME:-chia-runtime200-test}"

x-common-node: &common-node
  restart: "no"
  pull_policy: never
  command: ["${SCENARIO:-1}"]
  environment:
    SCENARIO: "${SCENARIO:-1}"
    SCENARIO_NODES: "${SCENARIO_NODES:-node01,node02,node03,node04,node06,node07,node08,node09}"
    FARMER_NODES: "${FARMER_NODES:-node01,node02,node03,node04}"
    TIMELORD_NODES: "${TIMELORD_NODES:-node06,node07}"
    VDF_NODES: "${VDF_NODES:-node08,node09}"
    VDF_CLIENTS_PER_TIMELORD: "${VDF_CLIENTS_PER_TIMELORD:-3}"
    TIE_TIMING_A_NODES: "${TIE_TIMING_A_NODES:-node06,node08}"
    TIE_TIMING_B_NODES: "${TIE_TIMING_B_NODES:-node07,node09}"
    TIE_COORDINATOR: "${TIE_COORDINATOR:-node09}"
    TIE_MAX_ATTEMPTS: "${TIE_MAX_ATTEMPTS:-12}"
    TIE_MAX_CAPTURE_GAP_MS: "${TIE_MAX_CAPTURE_GAP_MS:-1000}"
    BOOTSTRAP_TIMEOUT: "${BOOTSTRAP_TIMEOUT:-1800}"
    TIE_TIMEOUT: "${TIE_TIMEOUT:-1200}"
    TZ: "${TZ:-:/etc/localtime}"
  cap_add:
    - NET_ADMIN
  security_opt:
    - no-new-privileges:true
  pids_limit: 1024
  stop_grace_period: 30s
  tmpfs:
    - /tmp:size=268435456,mode=1777
  volumes:
    - /etc/localtime:/etc/localtime:ro
  networks:
    chia_internal: {}

x-farmer-resources: &farmer-resources
  cpu_period: 100000
  cpu_quota: 100000
  mem_limit: 3000000000
  memswap_limit: 3000000000
  storage_opt:
    size: "150000000000"

x-timelord-resources: &timelord-resources
  cpu_period: 100000
  cpu_quota: 125000
  mem_limit: 3000000000
  memswap_limit: 3000000000
  storage_opt:
    size: "37500000000"

x-vdf-resources: &vdf-resources
  cpu_period: 100000
  cpu_quota: 75000
  mem_limit: 3000000000
  memswap_limit: 3000000000
  storage_opt:
    size: "37500000000"

services:
  node01:
    <<: [*common-node, *farmer-resources]
    image: "chia-runtime200-node01:${RUNTIME_IMAGE_TAG:-local}"
    build:
      context: ..
      network: none
      pull: false
      dockerfile: docker/Dockerfile.node
      args:
        ASSETS_IMAGE: "chia-runtime200-assets:${RUNTIME_IMAGE_TAG:-local}"
        BASE_IMAGE: "chia-runtime200-base:${RUNTIME_IMAGE_TAG:-local}"
        NODE_ID: "01"
        NODE_ROLE: farmer
    hostname: node01
    networks:
      chia_internal:
        ipv4_address: 172.28.0.11

  node02:
    <<: [*common-node, *farmer-resources]
    image: "chia-runtime200-node02:${RUNTIME_IMAGE_TAG:-local}"
