name: "${COMPOSE_PROJECT_NAME:-sia-runtime200-test}"

x-common-node: &common-node
  restart: "no"
  pull_policy: never
  command: ["${SCENARIO:-1}"]
  environment:
    SCENARIO: "${SCENARIO:-1}"
    SCENARIO_NODES: "${SCENARIO_NODES:-node01,node02,node03,node04,node05,node06,node07,node08,node09}"
    BOOTSTRAP_TIMEOUT: "${BOOTSTRAP_TIMEOUT:-1800}"
    TIE_TIMEOUT: "${TIE_TIMEOUT:-1200}"
    TZ: "${TZ:-:/etc/localtime}"
  cap_add:
    - NET_ADMIN
  security_opt:
    - no-new-privileges:true
  pids_limit: 1024
  stop_grace_period: 30s
  tmpfs:
    - /tmp:size=268435456,mode=1777
  volumes:
    - /etc/localtime:/etc/localtime:ro
  networks:
    sia_internal: {}

x-farmer-resources: &farmer-resources
  cpu_period: 210000
  cpu_quota: 80000
  mem_limit: 1227133513
  memswap_limit: 1227133513
  storage_opt:
    size: "166666666668"

x-timing-resources: &timing-resources
  cpu_period: 210000
  cpu_quota: 240000
  mem_limit: 3681400539
  memswap_limit: 3681400539
  storage_opt:
    size: "41666666666"

services:
  node01:
    <<: [*common-node, *farmer-resources]
    image: "sia-runtime200-node01:${RUNTIME_IMAGE_TAG:-local}"
    build:
      context: ..
      network: none
      pull: false
      dockerfile: docker/Dockerfile.node
      args:
        ASSETS_IMAGE: "sia-runtime200-assets:${RUNTIME_IMAGE_TAG:-local}"
        BASE_IMAGE: "sia-runtime200-base:${RUNTIME_IMAGE_TAG:-local}"
        NODE_ID: "01"
        NODE_ROLE: farmer
    hostname: node01
    networks:
      sia_internal:
        ipv4_address: 172.28.0.11

